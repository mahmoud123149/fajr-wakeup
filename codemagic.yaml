# Codemagic CI/CD — Fajr WakeUp
# First cloud build: resolve deps, analyze, run Dart + Kotlin unit tests, and
# produce an installable DEBUG APK.
#
# Deliberately NOT configured: release signing / keystore, Firebase, any backend.
# This is a personal debug build (see android/app/build.gradle: the release type
# is only ever built here as --debug, and no signing config is referenced).
#
# Toolchain rationale (verified against the repo's Gradle config):
#   - Android Gradle Plugin 8.5.2  -> requires JDK 17
#   - Gradle 8.7 (wrapper)         -> supports JDK 17
#   - Kotlin 1.9.24, compileSdk 34, minSdk 26, targetSdk 34
#   => Java 17 is the correct, compatible choice.

workflows:
  android-debug:
    name: Fajr WakeUp — Android debug APK
    instance_type: mac_mini_m2        # free-plan compatible personal machine
    max_build_duration: 60            # minutes; generous for a first cold build

    environment:
      flutter: 3.47.9
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache            # Dart/Flutter packages
        - $HOME/.gradle/caches        # Gradle / AGP / AndroidX / ML Kit artifacts

    scripts:
      - name: Generate android/local.properties
        script: |
          set -euo pipefail
          # Resolve the Flutter and Android SDK roots dynamically, preferring the
          # requested env vars and falling back to robust equivalents.
          FLUTTER_SDK_PATH="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK_PATH" ]; then
            echo "ERROR: Android SDK root not found (ANDROID_SDK_ROOT/ANDROID_HOME unset)" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_SDK_PATH" "$FLUTTER_SDK_PATH" \
            > android/local.properties
          echo "Wrote android/local.properties:"
          cat android/local.properties

      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Flutter tests (Dart unit tests)
        script: flutter test

      - name: Android Kotlin unit tests (Gradle wrapper)
        script: |
          set -euo pipefail
          cd android
          ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
